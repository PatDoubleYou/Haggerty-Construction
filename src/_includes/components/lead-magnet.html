             <div class="rounded overflow-hidden shadow-lg border border-secondary bg-surface-card p-4 p-md-5 text-start lead-magnet-card" style="margin-top: -2rem;">
                 <h4 class="fw-bold mb-3">{{ leadMagnetTitle | default("See a real Project Success Plan") }}</h4>
                 <p class="text-muted small mb-4">{{ leadMagnetDescription | default("Our 12-page example estimate and Project Success Plan, the same paperwork every client gets. Enter your email and we'll send it within one business day.") }}</p>
                 <form name="lead-magnet" data-netlify="true" netlify-honeypot="website" method="POST" action="/plan-sent/">
                     <input type="hidden" name="form-name" value="lead-magnet" />
                     <!-- Honeypot: hidden from humans, irresistible to link-spam bots. Real visitors leave it blank. -->
                     <p class="visually-hidden" aria-hidden="true">
                         <label>Don't fill this out if you're human:
                             <input name="website" tabindex="-1" autocomplete="off">
                         </label>
                     </p>
                     <div class="mb-3">
                         <input type="email" class="form-control form-control-lg bg-transparent border-secondary" name="email" placeholder="Your Email Address" required>
                     </div>
                     <div class="form-check mb-4">
                         <input class="form-check-input border-secondary bg-transparent" type="checkbox" id="marketingConsent" name="marketing_consent" required>
                         <label class="form-check-label text-muted small" for="marketingConsent">
                             I agree to receive occasional construction tips and updates from Haggerty Construction.
                         </label>
                     </div>
                     <button type="submit" class="btn btn-primary w-100 btn-lg shadow">{{ leadMagnetButton | default("Send me the example") }}</button>
                 </form>
             </div>
