<!-- Contact Us Form -->

    <div class="row justify-content-center text-center mb-4" id="contact">
        <div class="col">
            <h2 class="animated-underline">Tell Us About Your Project</h2>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="bg-surface-card rounded-4 shadow-lg p-4 p-md-5 border border-secondary mb-5">
                <form name="request-quote" data-netlify="true" netlify-honeypot="website" method="POST" action="/success/">

                <input type="hidden" name="form-name" value="request-quote" />
                <input type="hidden" name="source_page" value="{{ page.url }}">
                <input type="hidden" name="form_identifier" value="Request for Estimate">

                <!-- Honeypot: hidden from humans, irresistible to link-spam bots. Real visitors leave it blank. -->
                <p class="visually-hidden" aria-hidden="true">
                    <label>Don't fill this out if you're human:
                        <input name="website" tabindex="-1" autocomplete="off">
                    </label>
                </p>

                <div class="mb-3">
                    <label for="customer_name" class="form-label">Name *</label>
                    <input type="text" class="form-control" id="customer_name" name="customer_name" required>
                </div>
                <div class="mb-3">
                    <label for="customer_phone" class="form-label">Phone *</label>
                    <input type="tel" class="form-control" id="customer_phone" name="customer_phone" required>
                </div>
                <div class="mb-3">
                    <label for="customer_email" class="form-label">Email *</label>
                    <input type="email" class="form-control" id="customer_email" name="customer_email" required>
                </div>
                <div class="mb-3">
                    <label for="service_type" class="form-label">Service Type</label>
                    <select class="form-control" id="service_type" name="service_type">
                        <option value="" selected>Select a service (optional)</option>
                        <option value="New Construction">New Construction</option>
                        <option value="Whole Home Renovation">Whole Home Renovation</option>
                        <option value="Kitchen Remodel">Kitchen Remodel</option>
                        <option value="Bathroom Remodel">Bathroom Remodel</option>
                        <option value="Basement Finishing">Basement Finishing</option>
                        <option value="Custom Cabinets and Storage">Custom Cabinets &amp; Storage</option>
                        <option value="Commercial Remodeling">Commercial Remodeling</option>
                        <option value="General Contracting">General Contracting / Custom Project</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="referral_source" class="form-label">How did you hear about us?</label>
                    <select class="form-control" id="referral_source" name="referral_source">
                        <option value="" selected>Please select an option (optional)</option>
                        <option value="Friend or Family Referral">Friend or Family Referral</option>
                        <option value="Professional Referral">Referral from another Professional</option>
                        <option value="Google / Online Search">Google / Online Search</option>
                        <option value="Social Media">Social Media (Facebook, Instagram, etc.)</option>
                        <option value="Yard Sign / Saw Our Truck">Yard Sign / Saw Our Truck</option>
                        <option value="Returning Customer">I'm a Returning Customer</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="project_description" class="form-label">Project Description</label>
                    <textarea class="form-control" id="project_description" rows="5" name="project_description"
                        placeholder="Tell us more about your project..."></textarea>
                </div>
                <p class="form-required">* Required fields</p>
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg mb-2">Request an Estimate</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <p class="text-muted mb-1" style="font-size: 0.9rem;">Prefer to talk? Just give us a call.</p>
                <a href="tel:+14354141974" class="btn btn-outline-light btn-lg px-4 ga-phone-link" id="cta-phone-call">
                    <i class="bi bi-telephone-fill me-2"></i>(435) 414-1974
                </a>
            </div>
            </div>
        </div>
    </div>

    <!-- Form funnel tracking: fires one GA4 event the first time each field is
         completed, so we can see where people drop off. Sends field NAMES and a
         step number only — never the values the visitor types. -->
    <script defer>
        (function () {
            var form = document.querySelector('form[name="request-quote"]');
            if (!form || typeof gtag !== 'function') return;

            var order = [
                'customer_name',
                'customer_phone',
                'customer_email',
                'service_type',
                'referral_source',
                'project_description'
            ];

            order.forEach(function (fieldName, i) {
                var field = form.elements[fieldName];
                if (!field) return;
                var fired = false;
                field.addEventListener('blur', function () {
                    if (fired || !field.value || !field.value.trim()) return;
                    fired = true;
                    gtag('event', 'form_field_complete', {
                        field_name: fieldName,
                        field_index: i + 1,
                        form_id: 'request-quote'
                    });
                });
            });
        })();
    </script>
